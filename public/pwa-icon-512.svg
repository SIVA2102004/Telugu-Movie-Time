<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16213E"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Golden Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Cinema Reel / Shield Icon Outline -->
  <circle cx="256" cy="200" r="110" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="24 12" opacity="0.8"/>
  <circle cx="256" cy="200" r="45" fill="url(#goldGrad)"/>

  <!-- Film Strip Spoke Holes -->
  <circle cx="256" cy="120" r="16" fill="#16213E"/>
  <circle cx="256" cy="280" r="16" fill="#16213E"/>
  <circle cx="176" cy="200" r="16" fill="#16213E"/>
  <circle cx="336" cy="200" r="16" fill="#16213E"/>

  <!-- TMT Brand Plaque -->
  <rect x="76" y="340" width="360" height="92" rx="24" fill="url(#badgeGrad)"/>
  
  <!-- TMT Text -->
  <text x="256" y="405" fill="#0D0D1A" font-family="'Montserrat', sans-serif" font-size="64" font-weight="900" letter-spacing="6" text-anchor="middle">
    TMT
  </text>
  
  <!-- Admin Subtitle text -->
  <text x="256" y="465" fill="#FFD700" font-family="'Montserrat', sans-serif" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle" opacity="0.9">
    ADMIN PORTAL
  </text>
</svg>
